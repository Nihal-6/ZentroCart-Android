<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ZentroCart — Style Your Everyday</title>
<style>
:root{--black:#080808;--panel:#151515;--white:#fff;--yellow:#ffcc00;--yellow2:#ffad00;--muted:#c9c9c9;--line:#333}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:0 20px}header{background:#050505;border-bottom:1px solid #292929;position:sticky;top:0;z-index:10}.nav{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand-logo{width:66px;height:66px;object-fit:contain;border-radius:50%;background:#000}.brandname{font-weight:900;letter-spacing:3px;font-size:19px}.tag{font-size:10px;letter-spacing:2px;color:#ddd}nav{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}nav a:hover{color:var(--yellow)}.hero{background:radial-gradient(ellipse at 85% 90%,#3c3000 0%,#141000 35%,#050505 75%);padding:76px 0 58px;border-bottom:1px solid #292929}.eyebrow{letter-spacing:3px;font-size:12px;font-weight:bold;color:var(--yellow)}h1,h2,h3,p{margin-top:0}h1,h2,.feature h2{font-family:Georgia,'Times New Roman',serif}h1{font-size:clamp(42px,8vw,76px);line-height:1.04;margin:14px 0 22px;max-width:690px}h2{font-size:clamp(30px,5vw,42px);line-height:1.1} .hero p{font-size:18px;max-width:540px;color:#ddd}.primary{border:1px solid var(--yellow);background:var(--yellow);color:#080808;border-radius:9px;padding:14px 22px;font-weight:800;display:inline-block}.primary:hover{background:var(--yellow2)}.perks{display:flex;gap:28px;flex-wrap:wrap;margin-top:42px;font-size:14px}.perks b{color:var(--yellow)}.perks span{color:#ccc;display:block;font-size:12px}.section{padding:55px 0;background:var(--black)}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:24px}.muted{color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid #444;border-radius:30px;background:#111;padding:9px 15px;color:#fff}.filter.active{background:var(--yellow);border-color:var(--yellow);color:#000}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.product{background:var(--panel);border:1px solid #303030;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #0008}.art{height:195px;background:linear-gradient(135deg,#282828,#101010);display:grid;place-items:center;font-size:75px;border-bottom:1px solid #333}.productbody{padding:16px}.product h3{font-size:17px;margin:0 0 5px}.price{font-weight:bold;color:var(--yellow);margin-bottom:12px}.add{width:100%;background:#171717;border:1px solid var(--yellow);border-radius:8px;padding:10px;color:var(--yellow)}.add:hover{background:var(--yellow);color:#000}.ordergrid{display:grid;grid-template-columns:1fr 1.35fr;gap:20px;margin-top:45px}.feature{border:1px solid #4d4100;border-radius:16px;background:linear-gradient(145deg,#282000,#090909 72%);padding:30px;min-height:410px;display:flex;flex-direction:column;justify-content:end}.feature h2{font-size:clamp(36px,5vw,52px);line-height:1.05}.panel{background:#141414;border:1px solid #333;border-radius:16px;padding:28px}.panel h2{font-size:32px;margin-bottom:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-weight:bold;font-size:12px;color:#eee}input,select,textarea{width:100%;border:1px solid #444;border-radius:7px;background:#080808;color:#fff;padding:12px;min-height:44px}input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow)}textarea{resize:vertical;min-height:82px}.submit{margin-top:16px;width:100%}.notice{margin-top:22px;background:#151300;border:1px solid #554600;padding:16px;border-radius:10px;font-size:13px;color:#eee}.notice strong,.notice b{color:var(--yellow)}.policy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:30px}.policy-card{background:#141414;border:1px solid #333;border-radius:12px;padding:20px}.policy-card .icon{font-size:26px;color:var(--yellow)}.policy-card h3{margin:7px 0;color:var(--yellow)}footer{border-top:1px solid #333;background:#050505;padding:32px 0}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}.foot a{text-decoration:underline;margin-right:12px}.hidden{display:none!important}.accent{color:var(--yellow)}@media(max-width:800px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}.ordergrid{grid-template-columns:1fr}.feature{min-height:260px}.nav{align-items:flex-start;flex-direction:column;padding-top:12px;padding-bottom:14px}.brand-logo{width:56px;height:56px}.hero{padding:54px 0}.perks{gap:18px}}@media(max-width:450px){.wrap{padding:0 15px}.products{gap:11px}.art{height:145px;font-size:55px}.productbody{padding:12px}.formgrid,.policy-grid{grid-template-columns:1fr}.hero p{font-size:15px}.panel{padding:19px}.perks{gap:14px}nav{gap:15px}}
</style>
</head>
